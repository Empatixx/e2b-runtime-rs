name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      E2B_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      E2B_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /opt/az /usr/lib/jvm && docker image prune -af >/dev/null && df -h /
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libclang-dev nftables musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci/s3.sh
      - run: docker run -d --name e2b-redis -p 6379:6379 redis:7-alpine
      - run: cargo fmt --all --check
      - run: scripts/ci/nbd-host.sh
      - run: scripts/ci/hugepages.sh
      - run: sudo sysctl -w net.ipv4.ip_forward=1
      - run: scripts/ci/vm-assets.sh
      - run: scripts/ci/guest-rootfs.sh
      - run: sudo chmod 666 /dev/kvm
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: sudo -E env "PATH=$PATH" cargo test --workspace -- --show-output
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.5"
      - run: sudo chown -R "$(id -u):$(id -g)" target
      - run: scripts/ci/vm-sdk-tests.sh
        env:
          E2B_SDK_DIR: ${{ runner.temp }}/e2b-sdk

  envd-musl:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler musl-tools file
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy -p envd --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo build --release --locked -p envd --target ${{ matrix.target }}
      - run: file target/${{ matrix.target }}/release/envd | tee /dev/stderr | grep -Eq "static(-pie|ally) linked"
      - run: sudo -E env "PATH=$PATH" cargo test -p envd --target ${{ matrix.target }}

  simple:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2b-runtime-simple
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler libclang-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2b-runtime-simple
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p e2b-node
      - run: cargo test --locked -p envd --lib

  kvm-spike:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: scripts/ci/kvm-spike.sh
