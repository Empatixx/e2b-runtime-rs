[package]
name = "envd"
version = "0.9.0"
edition = "2024"

[dependencies]
connectrpc = { version = "0.9", features = ["axum", "server"] }
buffa = { version = "0.9.2", features = ["json"] }
buffa-types = { version = "0.9.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
axum = { version = "0.8", features = ["http1", "http2", "multipart", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
http = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
nix = { version = "0.29", features = ["user", "signal", "fs", "time", "poll", "ioctl"] }
xattr = "1"
notify = "8"
tokio-stream = "0.1"
rand = "0.10"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
multer = "3"
mime_guess = "2"
parking_lot = "0.12"
pty-process = { version = "0.5", features = ["async"] }
rustix = { version = "1", features = ["process", "thread"] }
tempfile = "3"
futures = "0.3"
bon = "3.10.2"
moka = { version = "0.12.16", features = ["sync"] }

[build-dependencies]
connectrpc-build = "0.9"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
