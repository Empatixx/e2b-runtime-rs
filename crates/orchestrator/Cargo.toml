[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
futures = "0.3"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.29", features = ["fs", "ioctl", "mman", "net", "process", "socket", "uio", "user"] }
object_store = { version = "0.14", features = ["aws", "azure", "gcp"] }
parking_lot = "0.12"
prost = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
klickhouse = { version = "0.15", default-features = false, features = ["derive", "compression", "tls"] }
fred = { version = "10", default-features = false, features = ["i-keys", "i-scripts", "i-streams", "enable-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
prost-types = "0.14"
rand = "0.10"
roaring = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tar = "0.4"
xattr = "1"
flate2 = "1"
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
