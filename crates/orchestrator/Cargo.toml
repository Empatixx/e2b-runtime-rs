[package]
name = "orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls", "credentials-process", "sso"] }
aws-credential-types = "1"
aws-sdk-ecr = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
backon = { version = "1", default-features = false, features = ["std"] }
base64 = "0.22"
futures = "0.3"
hmac = "0.12"
httparse = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.29", features = ["fs", "ioctl", "mman", "net", "process", "socket", "uio", "user"] }
object_store = { version = "0.14", features = ["aws", "azure", "gcp"] }
p12-keystore = "0.3"
p224 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
percent-encoding = "2"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p521 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
parking_lot = "0.12"
prost = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
klickhouse = { version = "0.15", default-features = false, features = ["derive", "compression", "tls"] }
fred = { version = "10", default-features = false, features = ["i-keys", "i-scripts", "i-streams", "enable-rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
prost-types = "0.14"
quick-xml = "0.41"
rand = "0.10"
ring = "0.17"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "sha2"] }
roaring = "0.11"
serde = { version = "1", features = ["derive"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tar = "0.4"
tls-parser = "0.12"
tempfile = "3"
xattr = "1"
flate2 = "1"
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt", "io", "io-util"] }
opentelemetry = { version = "0.31", features = ["metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "gzip-tonic", "metrics", "trace", "logs"] }
opentelemetry-appender-tracing = { version = "0.31", features = ["experimental_use_tracing_span_context"] }
opentelemetry_sdk = { version = "0.31", features = ["metrics", "trace", "logs", "rt-tokio", "experimental_metrics_periodicreader_with_async_runtime", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime", "spec_unstable_metrics_views"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
launchdarkly-server-sdk = { version = "3.3.0", default-features = false, features = ["hyper-rustls-webpki-roots", "event-compression"] }
bon = "3.10.2"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["testing"] }
aws-runtime = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }
