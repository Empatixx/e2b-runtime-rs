[package]
name = "e2b-node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
overlaybd = { workspace = true }
uvm-ublk-daemon = { workspace = true }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["http1", "tokio", "json", "query"] }
base64 = "0.22"
bon = "3"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
nix = { version = "0.29", features = ["uio", "process", "signal"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opendal = { version = "0.55", default-features = false, features = ["services-s3"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
