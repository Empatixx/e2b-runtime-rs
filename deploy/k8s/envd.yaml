apiVersion: apps/v1
kind: Deployment
metadata:
  name: envd
  labels:
    app: envd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envd
  template:
    metadata:
      labels:
        app: envd
    spec:
      containers:
        - name: envd
          image: e2b-runtime-rs/envd:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: envd
              containerPort: 49983
          readinessProbe:
            httpGet:
              path: /health
              port: envd
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: envd
spec:
  selector:
    app: envd
  ports:
    - name: envd
      port: 49983
      targetPort: envd
