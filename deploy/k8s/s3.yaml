apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  labels:
    app: s3
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args: ["/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              value: minio
            - name: RUSTFS_SECRET_KEY
              value: minio123
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - name: s3
      port: 9000
      targetPort: s3
