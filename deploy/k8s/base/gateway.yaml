apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: e2b
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          nodeSelector: { e2b.dev/role: control }
      envoyHpa:
        minReplicas: 2
        maxReplicas: 10
        metrics:
          - type: Resource
            resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
      envoyService:
        externalTrafficPolicy: Local
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: e2b
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: e2b
    namespace: e2b
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: e2b
spec:
  gatewayClassName: e2b
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: WILDCARD_HOSTNAME
    - name: https
      protocol: HTTPS
      port: 443
      hostname: WILDCARD_HOSTNAME
      tls:
        mode: Terminate
        certificateRefs:
          - name: e2b-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - { name: e2b, sectionName: http }
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - { name: e2b, sectionName: https }
  hostnames: [API_HOSTNAME]
  rules:
    - backendRefs:
        - { name: api, port: 3000 }
      timeouts: { request: 0s }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sandboxes
spec:
  parentRefs:
    - { name: e2b, sectionName: https }
  rules:
    - backendRefs:
        - { name: client-proxy, port: 3002 }
      timeouts: { request: 0s }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: e2b-tls
spec:
  secretName: e2b-tls
  dnsNames: [WILDCARD_HOSTNAME]
  issuerRef:
    kind: ClusterIssuer
    name: e2b
