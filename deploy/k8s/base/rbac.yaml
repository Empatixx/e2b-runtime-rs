apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-discovery
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-discovery
subjects:
  - kind: ServiceAccount
    name: api
