apiVersion: batch/v1
kind: Job
metadata:
  name: envd-init
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:latest
          args:
            - -sf
            - -X
            - POST
            - http://envd:49983/init
            - -H
            - "content-type: application/json"
            - -d
            - '{"defaultUser":"user","defaultWorkdir":"/home/user"}'
